name: Build TGS2026 map asset
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-tgs2026-map.yml"
      - "tgs2026/index.html"
      - "tgs2026/sw.js"
permissions:
  contents: write
jobs:
  build-map:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF/WebP tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils webp
      - name: Download official TGS2026 PDF map
        run: curl -L --fail --retry 4 --retry-delay 3 -o /tmp/tgs2026-map.pdf "https://service.tgs.cesa.or.jp/files/96/tgs2026/map/2026TGS_MAP.pdf"
      - name: Render mobile map asset
        run: |
          pdftoppm -f 1 -singlefile -png -r 150 /tmp/tgs2026-map.pdf /tmp/tgs2026-map
          cwebp -quiet -q 60 -resize 3600 0 /tmp/tgs2026-map.png -o tgs2026/map.webp
      - name: Commit generated map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tgs2026/map.webp
          if git diff --cached --quiet; then
            echo "Map asset unchanged"
            exit 0
          fi
          git commit -m "chore: refresh TGS2026 map asset [skip ci]"
          git push
